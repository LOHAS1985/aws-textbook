<section class="chapter">
<h2>1. 発表の内容</h2>
<p>サインインや API の通信を、PrivateLink の VPC エンドポイント経由でAWSの内部ネットワークに閉じられます。VPC エンドポイントからのアクセスだけを許可したり、信頼する IP アドレス範囲を指定したりして、アクセス元を絞ることもできます。</p>
