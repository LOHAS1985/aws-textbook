<h2>1. 発表の内容</h2>
<p>OTel Container Insights を有効にすると、Karpenter(ノードの自動増減)や KEDA(イベントに応じたスケーリング)、AI 推論用の vLLM などの状態を、自分で Prometheus や Grafana を動かさずに確認できます。</p>
