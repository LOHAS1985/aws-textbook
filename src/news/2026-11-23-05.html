<section class="chapter">
<h2>1. 発表の内容</h2>
<p>CloudWatch Observability EKS アドオンに、クラスター全体で使える除外・包含の指定が加わりました。使っていない名前空間やメトリクス名、不要なラベルを取り込まないようにでき、取り込み量に応じた料金を抑えられます。</p>
