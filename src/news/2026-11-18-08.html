<h2>1. 発表の内容</h2>
<p>ローテーション用の Lambda 関数を書かなくても、スケジュールを設定するだけで外部サービスの認証情報を定期的に入れ替えられます。シークレットから値を取得しているアプリケーションは、コードを変えずに新しい値を受け取れます。</p>
