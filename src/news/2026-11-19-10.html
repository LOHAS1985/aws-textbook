<h2>1. 発表の内容</h2>
<p>復元前に、作成・更新・削除されるユーザーやグループの数を確認できます。復元後もユーザーの ID・パスワード・MFA 設定・パスキーはそのままで、再設定は不要です。Essentials プランと Plus プランで自動的に有効になり、追加料金はなく、復元できる期間は Essentials が最長1日、Plus が最長14日です。</p>
