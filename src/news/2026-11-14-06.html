<section class="chapter">
<h2>1. その他の発表</h2>
<p>Cognito が OAuth 2.0 のトークン交換(RFC 8693)に対応しました。サービスや AI エージェントが利用者の代理で別のサービスを呼ぶとき、利用者のトークンを、範囲が狭く対象が1つに限られ、更新用トークンを含まない新しいトークンに交換できます。</p>
