<section class="chapter">
<h2>1. 発表の内容</h2>
<p>AI 推論やメディア変換のような長い処理が、構成を変えずに最大30分まで動かせます。同期・非同期・イベントソースマッピングの呼び出しが対象で、Step Functions の標準ワークフローや耐久性のある関数からの呼び出しも含みます。</p>
