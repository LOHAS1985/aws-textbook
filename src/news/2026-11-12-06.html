<!-- title: S3 Tables:サーバーアクセスログに対応 -->
<!-- category: 2026年11月 -->
<!-- lead: S3 Tables のテーブルバケットへのリクエストを、サーバーアクセスログとして記録できるようになりました。 -->
<section class="chapter">
<h2>1. 発表の内容</h2>
<p>テーブルバケットへの操作の記録(要求元・操作・テーブル名・結果など)を、同じアカウント・リージョンの汎用バケットへ届けられます。形式は汎用バケットのログと同じなので、Athena などで既存の方法のまま分析できます。ログの配信は無料で、ログの保存料金だけがかかります。</p>
