<h2>1. 発表の内容</h2>
<p>IAM Roles Anywhere の信頼アンカー・プロファイル・証明書失効リスト(CRL)に、読みやすい別名(エイリアス)を付けられます。エイリアスはアカウントやリージョンが違っても同じ名前にできるため、イメージや構成管理のテンプレートを1つにまとめやすくなります。</p>
