<section class="chapter">
<h2>1. 発表の内容</h2>
<p>CloudFront がオリジンに接続するとき、TLS 証明書で互いを認証するオリジン mTLS が WebSocket と gRPC にも対応しました。共有シークレットや IP の許可リストの代わりに、HTTP・WebSocket・gRPC で同じ認証方式を追加料金なしで使えます。</p>

</dl>
