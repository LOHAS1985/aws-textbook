<section class="chapter">
<h2>1. 発表の内容</h2>
<p>ポッドは入れ替わりが速く、IP アドレスだけでは後から特定できませんでした。ログの形式に EKS のフィールドを足すだけで、ノードに監視ソフトを入れずに調べられます。VPC CNI プラグインを使う EC2 上のポッドが対象です。</p>
