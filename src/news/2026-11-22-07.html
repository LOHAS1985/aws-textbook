<section class="chapter">
<h2>1. 発表の内容</h2>
<p>CloudFormation のスタック数の既定の上限が、アカウントとリージョンごとに2,000から300,000になりました。顧客や環境ごとにスタックを作る構成でも、Service Quotas での引き上げ申請なしに増やせます。既存のスタックはそのまま使えます。</p>
