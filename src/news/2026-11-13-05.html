<section class="chapter">
<h2>1. 発表の内容</h2>
<p>AWS Lambda MicroVMs は、利用者やジョブごとに VM 並みの分離と素早い起動を提供する、サーバーレスの実行環境です。今回、MicroVM イメージを作るときに、これまでの Arm(AWS Graviton)に加えて x86 を選べるようになり、既存の x86 向けアプリやツールを作り直さずに動かせます。</p>
