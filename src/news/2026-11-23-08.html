<section class="chapter">
<h2>1. 発表の内容</h2>
<p>Data Hub は、13か月分の1時間単位・リソース単位のコストと使用量を CUR 2.0 の形式で用意する仕組みです。プレビューでは AWS FinOps Agent が使い、データのエクスポートや集計の仕組みを作らずに、コストが増えた原因のリソースやチーム別の内訳を調べられます。</p>
