<section class="chapter">
<h2>1. 発表の内容</h2>
<p>RDS for Oracle(Enterprise Edition)で、マイナーバージョンの更新を同じリージョンのレプリカに先に適用し、確認したうえで切り替える方法が使えるようになりました。切り替えは時間帯を選べ、期間内に切り替えなければレプリカは元のバージョンに戻ります。</p>
