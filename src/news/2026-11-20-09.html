<section class="chapter">
<h2>1. 発表の内容</h2>
<p>プラットフォームチームが、Lambda のランタイムの中身と更新を ECR 上の OCI コンテナイメージとして一元管理できるようになりました。共有部分の更新を、関数ごとに再デプロイしなくても反映できます。従来のカスタムランタイム機能は「bring your own language」という名称に変わりました。</p>
