<section class="chapter">
<h2>1. 発表の内容</h2>
<p>これまではリージョンごとにトークンを取得する必要がありました。AWS Sign-In の CreateBearerToken API で取得した1つのトークンで、複数リージョンのレジストリに push や pull ができます。有効期間は既定で12時間で、最短5分まで短くできます。従来のリージョン別トークンもそのまま使えます。</p>
