<h2>1. 発表の内容</h2>
<p>Google Cloud の VM、コンテナーイメージ、Cloud Run 関数、ID を自動で見つけ、設定の不備や脆弱性を検出します。AWS・Azure の結果と同じ画面で扱えます。連携を作ると、30日間の無料トライアルがあります。</p>
