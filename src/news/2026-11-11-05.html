<section class="chapter">
<h2>1. 発表の内容</h2>
<p>OpenSearch Service が、クローンを使ったバージョンアップに対応しました。現在のクラスターのデータを新バージョンのクローンにコピーし、同じ検索を両方に送って CloudWatch のメトリクスで性能を比べてから切り替えられます。切り替え前なら中止でき、切り替え後も、旧バージョンを残す期間を設定していればその間はロールバックできます。</p>
