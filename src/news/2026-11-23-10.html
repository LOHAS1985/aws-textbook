<section class="chapter">
<h2>1. 発表の内容</h2>
<p>新しいクラスターを作ってデータとアプリを移す必要がなく、フルマネージドなデータ移行で Express ブローカー(スループットが高く、スケールや復旧が速いタイプ)に切り替えられます。クラスターのエンドポイントとコンシューマーのオフセットは保たれます。</p>
