<h2>1. その他の発表</h2>
<p>RDS for Oracle で、自動マイナーバージョンアップや、メンテナンスウィンドウでのマイナーバージョン・OS の更新の停止時間が短くなりました。必要な準備をウィンドウの開始後ではなく、最大30分前から DB インスタンスの稼働中に済ませるためです。</p>
