<section class="chapter">
<h2>1. 発表の内容</h2>
<p>ListCallerAccessGrants の InstanceScope を ALL にすると、自分のインスタンスと、AWS RAM で共有されたすべてのインスタンスの許可が1回で返ります。GetDataAccess でも ALL を指定すると、所有アカウントを自動で探して認証情報を返します。追加料金はありません。</p>
