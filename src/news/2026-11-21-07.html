<h2>1. 発表の内容</h2>
<p>実行ロールのテンプレートを渡すと、StackSets が各アカウントにそのロールを作ってからデプロイします。これまで使えなかったネストされたスタック、マクロ、変換も使えます。追加料金はありません。</p>
