<section class="chapter">
<h2>1. 発表の内容</h2>
<p>ユーザープールの情報を待機用のリージョンへほぼ実時間で複製し、主のリージョンで障害があっても認証を続けられる機能です。これまで16の商用リージョンと GovCloud だけだった対応先が、アジア太平洋・ヨーロッパ・アフリカなどの追加リージョンに広がりました。</p>
