<section class="chapter">
<h2>1. 発表の内容</h2>
<p>EBS のスナップショットに、カスタマー管理のキーを追加で関連付けられます。AWS マネージドキーで暗号化したスナップショットでも、再暗号化せずに他のアカウントへ共有・コピーできます。</p>
