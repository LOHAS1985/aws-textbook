<section class="chapter">
<h2>1. 発表の内容</h2>
<p>FSx のファイルシステムにS3アクセスポイントをつなぐと、データをコピーせずに、S3 API経由で AthenaやBedrock Knowledge Bases などから読めます。今回、FSx for NetApp ONTAP は4リージョン、FSx for OpenZFS は20リージョンで新たに使えるようになりました。</p>
