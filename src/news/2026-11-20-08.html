<section class="chapter">
<h2>1. 発表の内容</h2>
<p>IAM account access manager は、IAM Identity Center のユーザーやグループに IAM ロールを割り当てる機能です。管理者・Entitlement Manager・ReadOnly の3つの AWS 管理ポリシー、Terraform・Pulumi・CloudFormation での構成、Okta や SailPoint などとの連携が加わりました。</p>
