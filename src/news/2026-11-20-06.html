<section class="chapter">
<h2>1. 発表の内容</h2>
<p>CloudFront の標準ログに、処理したサーバーの IP アドレス、本番とステージングの区別、動画プレーヤーが送る CMCD などの項目を含められるようになり、S3・CloudWatch Logs・Data Firehose へ配信できます。リアルタイムログ用のストリームを別に用意する必要はありません。</p>

</dl>
</section>
