<section class="chapter">
<h2>1. 発表の内容</h2>
<p>「Targeted bot control」を選ぶと、推奨の設定で管理ルールグループが追加されます。検出結果は高・中・低の信頼度にまとめられ、最新の検出を使い続けるバージョン指定の LATEST も使えます。以前は JavaScript SDK の組み込みやラベルを使ったルールの作成が必要でした。</p>
