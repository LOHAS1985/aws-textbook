<section class="chapter">
<h2>1. 発表の内容</h2>
<p>Lambda のプロビジョンドモード(イベントポーラー数の下限・上限を指定できる設定)の SQS FIFO キューで、1回に渡すメッセージの数を最大10,000件にできます。メッセージグループ内の順序は保たれたまま、呼び出しの回数が減ってスループットが上がります。</p>
