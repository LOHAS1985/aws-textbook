<ul class="card-list">
  <li data-keys="dea-c01 問題集 dea-c01  dea-c01 dea-c01の出題分野に沿って、データエンジニアの実務判断を練習する100問  1. 問題集の使い方 試験形式を想定して全問をランダムに解くか、復習する問題を選んで解いてください。「2つ選択」とある問題は、要件を満たす選択肢を2つ選びます。採点すると正解と解説が表示され、成績と間違えた問題はこのブラウザーに保存されます。 出題分野はaws公式のdea-c01試験ガイドに基づいています。javascriptが無効な場合は、各問題の「答えと解説を確認」を開いて答え合わせができます。 データ取り込み・変換 34% データストア管理 26% データ運用・サポート 22% データセキュリティ・ガバナンス 18% 2. 問題 分野1 データ取り込み・変換 (34%) 問1 販売システムはオンプレミスのリレーショナルデータベースで稼働し、awsへの切り替えまで数日間は更新が続きます。分析チームは移行後すぐに、amazon s3のデータレイクで最新データを利用したいと考えています。一方、アプリケーションの改修や独自のログ転送処理は避ける必要があります。初期データを移した後も更新を追従させる方法はどれですか。 最も適切な方法を1つ選んでください。 aws dmsでフルロードと変更データキャプチャ(cdc)を実行し、amazon s3をターゲットにする aws glueクローラーを定期実行し、データベースの変更をs3へコピーする aws datasyncでデータベースのトランザクションログをs3へ同期する aws dmsのフルロードだけを実行し、移行後の更新は対象にしない 答えと解説を確認 正解: a aws dmsのフルロードとcdcを組み合わせると、既存データを転送した後もデータベースの変更を継続して複製できます。s3ターゲットにすれば、後続の分析パイプラインへデータを渡せます。 b: glueクローラーはスキーマの検出とカタログ登録に使う機能で、データベースの変更を複製しません。 c: datasyncはファイル転送向けであり、データベースのトランザクションログをcdcとして処理しません。 d: フルロードだけでは、その後に発生する更新がデータレイクへ反映されません。 aws dms / aws glue / aws datasync 問2 注文イベントを複数の分析アプリケーションへ低レイテンシーで配信します。各アプリケーションは同じ全イベントをそれぞれ独立して読み取り、1つのアプリケーションの読み取り負荷が他に影響しない構成が必要です。また、障害時には直近48時間のイベントを再処理できるようにしたいと考えています。適切な構成はどれですか。 最も適切な方法を1つ選んでください。 amazon data firehoseから各アプリケーションへ直接配信し、読み取り位置を個別に指定する amazon kinesis data streamsの保持期間を48時間以上に設定し、コンシューマーに拡張ファンアウトを使う amazon sqsキューを1つ作り、すべてのアプリケーションでメッセージを共有して読み取る amazon eventbridgeルールでイベントを振り分け、過去48時間の任意の位置から再生する 答えと解説を確認 正解: b kinesis data streamsは複数のコンシューマーが同じストリームを読み取れるため、各アプリケーションが独立して処理できます。保持期間を要件以上に設定すれば、保持中のレコードを再処理できます。拡張ファンアウトはコンシューマーごとに読み取りスループットを分けます。 a: data firehoseはバッファリングして送信先へデータを配信するサービスで、各アプリケーションが読み取り位置を管理するストリームではありません。 c: sqsの1つのキューは、通常、複数のコンシューマーにメッセージを分配します。同じ全メッセージを各アプリケーションへ独立して配る要件には合いません。 d: eventbridgeはイベントのルーティングに適していますが、ストリームの保持期間と読み取り位置を使った再処理の要件には合いません。 amazon kinesis / amazon data firehose / amazon sqs / amazon eventbridge 問3 データレイクのamazon s3バケットには、parquet形式の日次ファイルが追加されます。aws glueジョブはスケジュール実行され、正常終了した入力を次回に再処理すると重複データが発生するため、新しく追加されたファイルを中心に処理したい要件です。ジョブごとに入力データの処理状態を保持し、再実行時の読み直しを抑える機能はどれですか。 最も適切な方法を1つ選んでください。 glueクローラーのスケジュールを設定し、検出したファイル名を処理済みとして管理する amazon athenaのパーティション射影を有効にし、glueジョブの実行履歴を保存する glueジョブのジョブブックマークを有効にし、データソースの処理状態を追跡する aws dmsのcdcタスクを作成し、s3オブジェクトの更新順を記録する 答えと解説を確認 正解: c glueのジョブブックマークは、ジョブのデータソースで処理したデータの状態を保持し、次回実行時に新しいデータを識別するために使います。状態を正しく保存するには、ジョブをブックマーク対応で実装し、正常終了時に状態をコミットします。 a: クローラーはスキーマやパーティションの検出に使います。etlジョブの処理済み状態を管理する機能ではありません。 b: パーティション射影はathenaがパーティション情報を組み立てる方法であり、glueジョブの処理状態を記録しません。 d: dmsのcdcはデータベース変更の複製に使います。s3ファイルを処理した状態の管理には使いません。 aws glue / amazon athena / aws dms 問11 基礎 分析部門はオンプレミスのpostgresqlデータベースから、毎晩必要な表を抽出し、列の整形を行ってamazon s3へ保存したいと考えています。数分ごとの変更追跡や無停止移行は要件ではなく、既存jdbc接続を利用します。抽出結果は後続分析に使うため、ジョブ履歴も確認したい場合の適切な方法はどれですか。今回、データは毎晩の定時処理で十分であり、レコード単位の即時反映や更新ログの追従は求められません。 最も適切なサービスを1つ選んでください。 glueクローラーにs3への転送と列変換を任せる glue etlジョブにjdbc接続を設定して読み込み、変換後にs3へ書く aws dmsでcdcタスクを作り、変更データだけをs3へ送る datasyncでpostgresqlの表をファイルシステムとして同期する 答えと解説を確認 正解: b 正解です。glue etlジョブはjdbcを含むデータソースから読み込み、変換してs3などへ出力できます。 a: クローラーはスキーマの検出とdata catalogへの登録に使い、データ自体のetlは行いません。 c: dms cdcは継続的な変更複製に適しますが、毎晩の抽出・列変換が目的で変更追跡が不要な条件には合いません。 d: datasyncはファイルシステム間転送向けで、jdbcデータベースの表を抽出・変換しません。 aws glueaws dmsaws datasync 問12 基礎 ecサイトから毎秒届く行動ログを、変換処理をほとんど加えずにamazon s3へ蓄積します。アプリ側にファイル分割や再試行を作らず、一定量または一定時間ごとにまとめてs3へ配信するマネージドサービスを選んでください。 最も適切なサービスを1つ選んでください。 amazon data firehose amazon kinesis data streams amazon msk aws glue data catalog 答えと解説を確認 正解: a 正解です。data firehoseはストリーミングデータをバッファリングし、s3などへマネージドに配信できます。 b: kinesis data streamsはコンシューマーが読み取るストリーム基盤です。直接s3へ配信する条件にはfirehoseが適します。 c: mskはapache kafka互換クラスター向けです。s3への単純なマネージド配信を求める条件には過剰です。 d: data catalogはテーブルやスキーマのメタデータを管理し、ストリームをs3へ配送しません。 amazon data firehoseamazon kinesisamazon msk 問13 基礎 s3に日々追加されるcsvをglue etlジョブでparquetに変換しています。正常終了したファイルを次回に繰り返し読まないことと、athenaから出力をテーブルとして検索できることが必要です。入力は日付ごとの別ファイルで、失敗後にジョブを再実行する場合もあります。設定する機能を選んでください。入力範囲の拡大に備え、再実行時の重複読込を減らし、分析利用者が共通のテーブル定義から参照できる必要があります。 要件を満たす選択肢を2つ選んでください。 glueジョブのジョブブックマークを有効にする glueクローラーを出力バケットのライフサイクルルールにする
