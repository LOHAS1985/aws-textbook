<ul class="card-list">
  <li data-keys="dea-c01 問題集 dea-c01  dea-c01 dea-c01の出題範囲に沿った実務判断を練習する200問  問1 販売システムはオンプレミスのリレーショナルデータベースで稼働し、awsへの切り替えまで数日間は更新が続きます。分析チームは移行後すぐに、amazon s3のデータレイクで最新データを利用したいと考えています。一方、アプリケーションの改修や独自のログ転送処理は避ける必要があります。初期データを移した後も更新を追従させる方法はどれですか。 最も適切な方法を1つ選んでください。 aws dmsでフルロードと変更データキャプチャ(cdc)を実行し、amazon s3をターゲットにする aws glueクローラーを定期実行し、データベースの変更をs3へコピーする aws datasyncでデータベースのトランザクションログをs3へ同期する aws dmsのフルロードだけを実行し、移行後の更新は対象にしない 答えと解説を確認 正解: a aws dmsのフルロードとcdcを組み合わせると、既存データを転送した後もデータベースの変更を継続して複製できます。s3ターゲットにすれば、後続の分析パイプラインへデータを渡せます。 b: glueクローラーはスキーマの検出とカタログ登録に使う機能で、データベースの変更を複製しません。 c: datasyncはファイル転送向けであり、データベースのトランザクションログをcdcとして処理しません。 d: フルロードだけでは、その後に発生する更新がデータレイクへ反映されません。 aws dms / aws glue / aws datasync 問2 注文イベントを複数の分析アプリケーションへ低レイテンシーで配信します。各アプリケーションは同じ全イベントをそれぞれ独立して読み取り、1つのアプリケーションの読み取り負荷が他に影響しない構成が必要です。また、障害時には直近48時間のイベントを再処理できるようにしたいと考えています。適切な構成はどれですか。 最も適切な方法を1つ選んでください。 amazon data firehoseから各アプリケーションへ直接配信し、読み取り位置を個別に指定する amazon kinesis data streamsの保持期間を48時間以上に設定し、コンシューマーに拡張ファンアウトを使う amazon sqsキューを1つ作り、すべてのアプリケーションでメッセージを共有して読み取る amazon eventbridgeルールでイベントを振り分け、過去48時間の任意の位置から再生する 答えと解説を確認 正解: b kinesis data streamsは複数のコンシューマーが同じストリームを読み取れるため、各アプリケーションが独立して処理できます。保持期間を要件以上に設定すれば、保持中のレコードを再処理できます。拡張ファンアウトはコンシューマーごとに読み取りスループットを分けます。 a: data firehoseはバッファリングして送信先へデータを配信するサービスで、各アプリケーションが読み取り位置を管理するストリームではありません。 c: sqsの1つのキューは、通常、複数のコンシューマーにメッセージを分配します。同じ全メッセージを各アプリケーションへ独立して配る要件には合いません。 d: eventbridgeはイベントのルーティングに適していますが、ストリームの保持期間と読み取り位置を使った再処理の要件には合いません。 amazon kinesis / amazon data firehose / amazon sqs / amazon eventbridge 問3 データレイクのamazon s3バケットには、parquet形式の日次ファイルが追加されます。aws glueジョブはスケジュール実行され、正常終了した入力を次回に再処理すると重複データが発生するため、新しく追加されたファイルを中心に処理したい要件です。ジョブごとに入力データの処理状態を保持し、再実行時の読み直しを抑える機能はどれですか。 最も適切な方法を1つ選んでください。 glueクローラーのスケジュールを設定し、検出したファイル名を処理済みとして管理する amazon athenaのパーティション射影を有効にし、glueジョブの実行履歴を保存する glueジョブのジョブブックマークを有効にし、データソースの処理状態を追跡する aws dmsのcdcタスクを作成し、s3オブジェクトの更新順を記録する 答えと解説を確認 正解: c glueのジョブブックマークは、ジョブのデータソースで処理したデータの状態を保持し、次回実行時に新しいデータを識別するために使います。状態を正しく保存するには、ジョブをブックマーク対応で実装し、正常終了時に状態をコミットします。 a: クローラーはスキーマやパーティションの検出に使います。etlジョブの処理済み状態を管理する機能ではありません。 b: パーティション射影はathenaがパーティション情報を組み立てる方法であり、glueジョブの処理状態を記録しません。 d: dmsのcdcはデータベース変更の複製に使います。s3ファイルを処理した状態の管理には使いません。 aws glue / amazon athena / aws dms 問11 基礎 分析部門はオンプレミスのpostgresqlデータベースから、毎晩必要な表を抽出し、列の整形を行ってamazon s3へ保存したいと考えています。数分ごとの変更追跡や無停止移行は要件ではなく、既存jdbc接続を利用します。抽出結果は後続分析に使うため、ジョブ履歴も確認したい場合の適切な方法はどれですか。今回、データは毎晩の定時処理で十分であり、レコード単位の即時反映や更新ログの追従は求められません。 最も適切なサービスを1つ選んでください。 glueクローラーにs3への転送と列変換を任せる glue etlジョブにjdbc接続を設定して読み込み、変換後にs3へ書く aws dmsでcdcタスクを作り、変更データだけをs3へ送る datasyncでpostgresqlの表をファイルシステムとして同期する 答えと解説を確認 正解: b 正解です。glue etlジョブはjdbcを含むデータソースから読み込み、変換してs3などへ出力できます。 a: クローラーはスキーマの検出とdata catalogへの登録に使い、データ自体のetlは行いません。 c: dms cdcは継続的な変更複製に適しますが、毎晩の抽出・列変換が目的で変更追跡が不要な条件には合いません。 d: datasyncはファイルシステム間転送向けで、jdbcデータベースの表を抽出・変換しません。 aws glueaws dmsaws datasync 問12 基礎 ecサイトから毎秒届く行動ログを、変換処理をほとんど加えずにamazon s3へ蓄積します。アプリ側にファイル分割や再試行を作らず、一定量または一定時間ごとにまとめてs3へ配信するマネージドサービスを選んでください。 最も適切なサービスを1つ選んでください。 amazon data firehose amazon kinesis data streams amazon msk aws glue data catalog 答えと解説を確認 正解: a 正解です。data firehoseはストリーミングデータをバッファリングし、s3などへマネージドに配信できます。 b: kinesis data streamsはコンシューマーが読み取るストリーム基盤です。直接s3へ配信する条件にはfirehoseが適します。 c: mskはapache kafka互換クラスター向けです。s3への単純なマネージド配信を求める条件には過剰です。 d: data catalogはテーブルやスキーマのメタデータを管理し、ストリームをs3へ配送しません。 amazon data firehoseamazon kinesisamazon msk 問13 基礎 s3に日々追加されるcsvをglue etlジョブでparquetに変換しています。出力はathenaからテーブルとして検索できる必要があります。入力は日付ごとの別ファイルで、失敗後にジョブを再実行する場合もあります。入力範囲の拡大にも対応し、処理済みファイルの重複読込を抑える設定を選んでください。 要件を満たす選択肢を2つ選んでください。 glueジョブのジョブブックマークを有効にする glueクローラーを出力バケットのライフサイクルルールにする 出力テーブルのスキーマをglue data catalogに登録する athenaのクエリ結果再利用をブックマークの代わりに使う 答えと解説を確認 正解: a、c 正解です。テーブル定義とs3上の場所をcatalogに登録すると、athenaなどから参照できます。 b: クローラーはスキーマやパーティションをカタログ化しますが、オブジェクトの保存期間を管理しません。 d: これはathenaのクエリ結果に関する機能で、glue etl入力の処理状態を追跡しません。 aws glueamazon athena 問14 基礎 営業部門のsaas crmに保存される顧客情報を毎晩amazon s3へ取り込みます。独自api連携コードを保守せず、対応コネクタで定期転送し、転送対象の項目も選びたい場合に適するサー ファイルだけを保持期限で管理し、期限後は不要なオブジェクトを継続して整理します。削除を設定する機能はどれですか。 最も適切な機能を1つ選んでください。 s3 lifecycleの有効期限アクション s3 transfer acceleration aws glueクローラー amazon s3 inventory 答えと解説を確認 正解: a 正解です。lifecycleの有効期限アクションは、指定した条件や経過日数に達したオブジェクトの削除を管理できます。 b: transfer accelerationは長距離のアップロード・ダウンロードを高速化する機能で、オブジェクトを期限後に削除しません。 c: クローラーはスキーマの検出とカタログ更新に使い、s3オブジェクトの保持期限を管理しません。 d: s3 inventoryはオブジェクト一覧のレポートを作成しますが、保持日数に基づく削除ルールではありません。 amazon s3 問152 標準 データチームはamazon s3に保存する集計結果を同じキーで定期的に上書きします。誤った書き込みや誤削除から過去のオブジェクト状態を復元できるようにし、現行のオブジェクトを維持したまま変更履歴を保存します。復旧操作は必要時に行い、過去版の保持期間も別途管理します。適した設定はどれですか。 最も適した機能を1つ選んでください。 amazon s3のバージョニングを有効にする s3 lifecycleで現在のオブジェクトを直ちに期限切れにする s3の静的ウェブサイトホスティングを有効にする amazon dynamodbのtime to liveを設定する 答えと解説を確認 正解: a 正解です。バージョニングを有効にすると、同じキーへの上書きや削除後も過去バージョンを保持し、必要に応じて復元できます。 b: 期限切れアクションはオブジェクトの削除を進める設定であり、過去の状態を復元する履歴保持にはなりません。 c: 静的ウェブサイトホスティングはオブジェクトのweb配信向けで、上書き前のバージョンを保持しません。 d: dynamodb ttlは項目の期限後削除に使いますが、s3オブジェクトの変更履歴や復元には使えません。 amazon s3 問153 標準 利用者から削除請求を受けたデータが、バージョニングを有効にしたamazon s3バケットに保存されています。監査担当者が削除範囲を後から確認できるよう記録を残し、複製先にも対象データを残さない必要があります。誤って旧データを残さず、完全な削除に向けて行うことを2つ選んでください。 必要な対応を2つ選んでください。 オブジェクトに削除マーカーを追加して対応を完了する 対象キーの全バージョンと削除マーカーを確認して削除する 削除請求の対象を別のs3プレフィックスへ移動する レプリケーション先の対象バージョンも確認し、必要な削除を行う 答えと解説を確認 正解: b、d 正解です。複製設定や削除の伝播条件を確認し、複製先に残る対象データも削除要件に沿って処理します。 a: バージョニングが有効な場合、削除マーカーだけでは過去のオブジェクトバージョンが残り、データの完全な削除にはなりません。 c: プレフィックスの移動はコピーと削除の操作であり、コピー先にデータを残すため削除要件を満たしません。 amazon s3 問154 応用 注文データベースは単一リージョンで稼働し、アプリケーションは短時間のアベイラビリティーゾーン障害から自動復旧する必要があります。日次の手動バックアップだけには依存できず、リージョン全体の障害に備えた別リージョンでの復旧も求められます。復旧手順を定期検証し、バックアップの取得と別リージョンへのコピーを自動化して、定めた復旧目標も満たし、別リージョンでの試験復旧も行う構成はどれですか。 最も適切な構成を1つ選んでください。 単一azのdbインスタンスと同一az内の手動エクスポート 読み取りレプリカだけを同じazに作成する rdsをマルチaz配置にし、バックアップを別リージョンへコピーする s3のバージョニングだけを有効にする 答えと解説を確認 正解: c 正解です。マルチaz配置はaz障害時の可用性を高め、別リージョンのバックアップはリージョン障害からの復旧に備えます。 a: 単一az障害への自動フェイルオーバーがなく、同一az内の保存だけではリージョン障害に備えられません。 b: 読み取りレプリカは読み取り処理の拡張などに使いますが、同一azの配置ではaz障害からの自動復旧を満たしません。 d: s3のオブジェクトバージョニングはdbインスタンスの可用性や復旧用の別リージョンバックアップを構成しません。 amazo
